# Build the images the repos' CI runs in, for every LLVM commit a repo names:
#   ghcr.io/ps2max32/llvm:<LLVM commit, 12>-<recipe>  the LLVM (about 2 hours);
#     <recipe> is a hash of llvm/Dockerfile and ALPINE, so a changed recipe
#     builds a new image instead of reusing the old one
#   ghcr.io/ps2max32/ps2max:llvm-<LLVM commit, 12>     the toolchain on it
#     (ps2max/Dockerfile), the image .github/workflows/build.yml runs in
#
# Which LLVM commits: the LLVM_REF of every ps2max32 repo's ps2max.deps on its
# default branch (scripts/llvm-refs.sh), or the one given to a manual run
# (scripts/deps.sh in ps2max starts that when it pins an LLVM without image).
# Nightly: only the missing images. A push here (a changed recipe) or a
# manual run: the ps2max images again too.
name: images

on:
  push:
    branches: [main]
    paths: [versions.env, llvm/**, ps2max/**, scripts/fetch-deps.sh, scripts/llvm-refs.sh, .github/workflows/images.yml]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      llvm_ref:
        description: 'LLVM commit (ps2max32/llvm, 40 hex digits); empty: every LLVM_REF the repos name'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ inputs.llvm_ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/ps2max32

jobs:
  refs:
    runs-on: ubuntu-26.04
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - uses: actions/checkout@v7
      - id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.llvm_ref }}
        run: |
          if [ -n "$INPUT" ]; then
            echo "$INPUT" | grep -qxE '[0-9a-f]{40}' || { echo "::error::llvm_ref: 40 hex digits"; exit 1; }
            refs=$INPUT
          else
            refs=$(sh scripts/llvm-refs.sh)
          fi
          echo "$refs"
          echo "refs=$(printf '%s\n' $refs | jq -Rnc '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  images:
    needs: refs
    if: needs.refs.outputs.refs != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.refs.outputs.refs) }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        env:
          REF: ${{ matrix.ref }}
        run: |
          grep -v '^#' versions.env | grep = >> "$GITHUB_ENV"
          . ./versions.env
          recipe=$( (cat llvm/Dockerfile; echo "$ALPINE") | sha256sum | cut -c1-8)
          echo "llvm=$REGISTRY/llvm:$(echo "$REF" | cut -c1-12)-$recipe" >> "$GITHUB_OUTPUT"
          echo "ps2max=$REGISTRY/ps2max:llvm-$(echo "$REF" | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: exists
        run: |
          have() { docker manifest inspect "$1" > /dev/null 2>&1 && echo true || echo false; }
          echo "llvm=$(have "${{ steps.tag.outputs.llvm }}")" >> "$GITHUB_OUTPUT"
          echo "ps2max=$(have "${{ steps.tag.outputs.ps2max }}")" >> "$GITHUB_OUTPUT"
      - name: Free disk space
        if: steps.exists.outputs.llvm != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        if: steps.exists.outputs.llvm != 'true'
        with:
          context: llvm
          push: true
          tags: ${{ steps.tag.outputs.llvm }}
          build-args: |
            ALPINE=${{ env.ALPINE }}
            LLVM_REPO=${{ env.LLVM_REPO }}
            LLVM_REF=${{ matrix.ref }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v7
        if: steps.exists.outputs.ps2max != 'true' || steps.exists.outputs.llvm != 'true' || github.event_name != 'schedule'
        with:
          context: .
          file: ps2max/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.ps2max }}
          build-args: |
            LLVM_IMAGE=${{ steps.tag.outputs.llvm }}
            PS2SDK_IMAGE=${{ env.PS2SDK_IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
