# .github/workflows/ps2.yml of ps2max32/<app> (template: ci/app.yml of ps2max32/docker).
# Builds with the commits its ps2max.deps names (LLVM, maxsdk, ...), through
# the reusable build of ps2max32/docker. Every push and PR: the game as an
# artifact; a tag v*: also a GitHub release with it.
# Repos with submodules (duke3d, halflife) add `setup: make submodules`.
name: ps2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ps2:
    uses: ps2max32/docker/.github/workflows/build.yml@main
    with:
      artifacts: |
        out/*.elf
        out/*.hog
