# .github/workflows/ps2.yml of ps2max32/mxshell (template: ci/mxshell.yml of ps2max32/docker).
# Builds with the commits its ps2max.deps names (LLVM, maxsdk, ...), through
# the reusable build of ps2max32/docker. Every push and PR: out/MXOS (MXSHELL.ELF and the
# storage drivers it loads) and the store's package of MXSTORE as an artifact; a tag v*:
# also a GitHub release with the package (the store updates itself from it).
name: ps2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ps2:
    uses: ps2max32/docker/.github/workflows/build.yml@main
    with:
      build: make -j$(nproc) OUT=$PWD/out all package
      artifacts: |
        out/MXOS
        out/*-ps2max.zip
